# LiveKit config for production behind Caddy.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: true
turn:
  enabled: true
  # TLS is terminated by Caddy for the web UI; TURN/TLS needs its own cert or use UDP 3478.
  udp_port: 3478
  domain: ${DOMAIN}
keys:
  ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
logging:
  level: info
