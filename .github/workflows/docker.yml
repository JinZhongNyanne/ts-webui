# Builds the hub image (which also serves the web UI) and pushes it to GHCR,
# so a server can pull it instead of building the whole toolchain itself.
name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Build on pull requests too, so a broken Dockerfile is caught before merge.
  # Those runs never push: a fork's token cannot write to the registry anyway.
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "deploy/Dockerfile.hub"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

# Two pushes close together (two PRs merged back to back) used to build side
# by side, and whichever finished last owned `latest` — which could be the
# older commit. Now a newer run on the same ref cancels the older one, so
# `latest` only ever moves forward. The newer commit contains the older one.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # Lowercased below: GHCR refuses an image name with capitals, and the
  # repository owner here is spelled "JinZhongNyanne".
  IMAGE_NAME: ${{ github.repository }}-hub

jobs:
  # Servers follow `latest`, so every push to main can go live on its own.
  # Nothing is published unless the whole workspace type-checks, passes its
  # tests and is formatted; a failure here leaves `latest` where it was.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # The hub and web import the protocol package's compiled output.
      - run: npm run build -w packages/protocol
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check

  hub:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image name
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.hub
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_ID=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
